[package]
name = "treease-desktop"
version = "0.2.0"
description = "Treease Desktop Workspace host"
authors = ["Treease"]
edition = "2021"
license-file = "../../LICENSE"
repository = "https://github.com/loggerhead/treease"
homepage = "https://github.com/loggerhead/treease"

[[bin]]
name = "Treease"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-wdio = "1.2.0"
tauri-plugin-wdio-webdriver = "1.2.0"
tauri-plugin-window-state = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-updater = "2.10.1"
